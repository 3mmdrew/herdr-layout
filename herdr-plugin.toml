id = "herdr-layout"
name = "Layouts"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Define and load workspace layouts from Lua config files"
platforms = ["linux", "macos"]

[[actions]]
id = "apply"
title = "Apply layout"
contexts = ["workspace"]
command = ["lua", "bin/herdr-layout"]

[[actions]]
id = "pick"
title = "Pick and apply a layout"
contexts = ["workspace"]
command = ["lua", "bin/herdr-layout-pick"]

[[panes]]
id = "picker"
title = "Pick layout"
placement = "popup"
width = "60%"
height = 20
command = ["lua", "bin/herdr-layout-picker"]
